<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P4HB</title>
  <meta name="description" content="P4HB portfolio" />
  <meta name="color-scheme" content="dark" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0d'/%3E%3Ctext x='50' y='64' font-family='monospace' font-weight='bold' font-size='42' fill='%23ffb020' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="css/style.css?v=20260708-design3" />
</head>
<body>
  <a class="skip-link" href="#main" data-skip-link>Skip to content</a>

  <!-- ===================== Header / Nav ===================== -->
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="#home" data-brand>P4HB</a>

      <nav class="nav-desktop" aria-label="Primary">
        <ul data-nav-links></ul>
      </nav>

      <div class="nav-actions">
        <button type="button" class="lang-toggle" data-lang-toggle></button>
        <button
          type="button"
          class="menu-toggle"
          data-menu-toggle
          aria-expanded="false"
          aria-controls="mobile-nav"
        ></button>
      </div>
    </div>

    <!-- Mobile nav drawer -->
    <div class="nav-overlay" data-nav-overlay hidden></div>
    <nav id="mobile-nav" class="nav-mobile" aria-label="Mobile">
      <ul data-nav-links-mobile></ul>
      <button type="button" class="lang-toggle-mobile" data-lang-toggle-mobile></button>
    </nav>
  </header>

  <main id="main">
    <!-- ===================== Hero ===================== -->
    <section id="home" class="hero">
      <div class="hero-bg" aria-hidden="true">
        <svg class="hero-grid" viewBox="0 0 800 600" preserveAspectRatio="none">
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.5"/>
            </pattern>
          </defs>
          <rect width="800" height="600" fill="url(#grid)"/>
        </svg>
        <svg class="hero-glyphs" viewBox="0 0 800 600" aria-hidden="true">
          <circle cx="660" cy="120" r="1.6" fill="currentColor"/>
          <circle cx="700" cy="200" r="1.6" fill="currentColor"/>
          <circle cx="620" cy="240" r="1.6" fill="currentColor"/>
          <path d="M600 120 L660 120 L660 200 L700 200" fill="none" stroke="currentColor" stroke-width="1"/>
          <path d="M580 300 L620 300 L620 240" fill="none" stroke="currentColor" stroke-width="1"/>
        </svg>
      </div>

      <div class="hero-inner">
        <div class="hero-copy">
          <p class="eyebrow mono" data-hero-eyebrow></p>
          <h1 class="hero-name" data-hero-name>P4HB</h1>
          <p class="hero-name-note mono" data-hero-name-note></p>
          <p class="hero-tagline" data-hero-tagline></p>

          <ul class="badge-row" data-hero-badges></ul>

          <div class="hero-contact">
            <a class="contact-link" data-hero-github href="https://github.com/P4HB" target="_blank" rel="noopener noreferrer">
              <span class="contact-icon" data-icon-slot></span>
              <span data-label-slot></span>
            </a>
            <a class="contact-link" data-hero-email href="mailto:naldadev@gmail.com">
              <span class="contact-icon" data-icon-slot></span>
              <span data-label-slot></span>
            </a>
          </div>
        </div>

        <aside class="hero-signal" aria-hidden="true">
          <div class="signal-head mono">
            <span>VEHICLE DATA PIPELINE</span>
            <span>LIVE</span>
          </div>
          <div class="signal-wave">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="signal-grid">
            <div>
              <span class="signal-label mono">INPUT</span>
              <strong>CAN / GNSS</strong>
            </div>
            <div>
              <span class="signal-label mono">LOG</span>
              <strong>BLF / MF4</strong>
            </div>
            <div>
              <span class="signal-label mono">MODEL</span>
              <strong>SVM / CNN</strong>
            </div>
            <div>
              <span class="signal-label mono">OUTPUT</span>
              <strong>Road State AI</strong>
            </div>
          </div>
          <div class="signal-flow mono">
            <span>sensor</span>
            <span>preprocess</span>
            <span>infer</span>
          </div>
        </aside>
      </div>

      <p class="scroll-hint mono" data-hero-scroll-hint></p>
    </section>

    <!-- ===================== Highlights ===================== -->
    <section id="highlights" class="section highlights">
      <div class="section-inner">
        <header class="section-head reveal">
          <h2 class="section-title" data-highlights-title></h2>
          <p class="section-subtitle" data-highlights-subtitle></p>
        </header>
        <div class="highlights-grid" data-highlights-grid></div>
      </div>
    </section>

    <!-- ===================== Experience ===================== -->
    <section id="experience" class="section experience">
      <div class="section-inner">
        <header class="section-head reveal">
          <h2 class="section-title" data-experience-title></h2>
          <p class="section-subtitle" data-experience-subtitle></p>
        </header>
        <div class="timeline" data-experience-timeline></div>
      </div>
    </section>

    <!-- ===================== Projects ===================== -->
    <section id="projects" class="section projects">
      <div class="section-inner">
        <header class="section-head reveal">
          <h2 class="section-title" data-projects-title></h2>
          <p class="section-subtitle" data-projects-subtitle></p>
        </header>
        <div class="project-filters mono" data-project-filters role="group" aria-label="Filter projects by tag"></div>
        <div class="projects-grid" data-projects-grid></div>
      </div>
    </section>

    <!-- ===================== Skills ===================== -->
    <section id="skills" class="section skills">
      <div class="section-inner">
        <header class="section-head reveal">
          <h2 class="section-title" data-skills-title></h2>
          <p class="section-subtitle" data-skills-subtitle></p>
        </header>
        <div class="skills-grid" data-skills-grid></div>
      </div>
    </section>
  </main>

  <!-- ===================== Footer / Contact ===================== -->
  <footer id="contact" class="site-footer">
    <div class="footer-inner">
      <div class="footer-main">
        <h2 class="footer-title" data-footer-title></h2>
        <p class="footer-body" data-footer-body></p>
      </div>
      <div class="footer-links">
        <a class="contact-link" data-footer-github href="https://github.com/P4HB" target="_blank" rel="noopener noreferrer">
          <span class="contact-icon" data-icon-slot></span>
          <span data-label-slot></span>
        </a>
        <a class="contact-link" data-footer-email href="mailto:naldadev@gmail.com">
          <span class="contact-icon" data-icon-slot></span>
          <span data-label-slot></span>
        </a>
      </div>
    </div>
    <p class="footer-copyright mono" data-footer-copyright></p>
  </footer>

  <script src="js/i18n.js?v=20260708-design3"></script>
  <script src="js/projects.js?v=20260708-design3"></script>
  <script src="js/main.js?v=20260708-design3"></script>
</body>
</html>
